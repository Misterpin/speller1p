# Synthetic EDF replay. Generate locally with:
# python -m eeg_speller.physiology.edf_demo --text "привет"
inherits: gui_slow.yaml
mode: {llm: 'off'}
stimulus: {flash_ms: 100, isi_ms: 400, pause_ms: 500}
epoch: {n_repetitions: 2}
physiology:
  plugin: p300
  channels: [Cz, Pz, P3, P4]
  baseline_s: [-0.2, 0.0]
  response_s: [0.25, 0.5]
  window_s: [-0.2, 0.8]
  bandpass_hz: [0.5, 15.0]
  artifact_uv: 150.0
  model_path: runs/edf_demo/p300_model.json
  data_timeout_s: 5
  max_clock_uncertainty_ms: 20
  max_replay_drift_ms: 75
  source:
    kind: edf_replay
    path: runs/edf_demo/test.edf
    channel_aliases: {}
